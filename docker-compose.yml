services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bellum_resources
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: bellum_resources
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bellum_resources -d bellum_resources"]
      interval: 5s
      timeout: 5s
      retries: 12
