[project]
name = "bellum-gero-resources"
version = "0.1.0"
description = "Bellum Gero Resources database foundation"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.20,<1",
    "itsdangerous>=2.2,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["web/templates/*.html", "web/static/*.css"]
